<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>レビュー登録｜確認</title>
</head>
<body>
	<h2>レビュー登録確認</h2>
	<table class="confirm-table" th:object="${reviewRegistForm}">
	<tr>
		<td class="guide">店舗（ID、名）</td>
		<td th:text="*{restaurantId} + *{restaurantName}"></td>
	</tr>
	<tr>
		<td class="guide">利用者ID</td>
		<td th:text="*{userId}"></td>
	</tr>
	<tr>
		<td class="guide">来日日</td>
		<td th:text="*{visitDate}"></td>
	</tr>
	<tr>
		<td class="guide">評価（１〜５）</td>
		<td th:text="*{rating}"></td>
	</tr>
	<tr>
		<td class="guide">一言コメント</td>
		<td th:text="*{comment}"></td>
	</tr>
	</table>
		
	<form th:action="@{/confirm-regist-review}" method="POST" th:object="${reviewRegistForm}">
		<input type="hidden" th:field="*{restaurantId}">
		<input type="hidden" th:field="*{userId}">
		<input type="hidden" th:field="*{visitDate}">
		<input type="hidden" th:field="*{rating}">
		<input type="hidden" th:field="*{comment}" class="btn">
		<input type="submit" value="登録する" class="btn">
	</form>

	<form th:action="@{/show-review-form-ret}" method="POST" th:object="${reviewRegistForm}">
		<input type="hidden" th:field="*{restaurantId}">
		<input type="hidden" th:field="*{restaurantName}">
		<input type="hidden" th:field="*{userId}">
		<input type="hidden" th:field="*{visitDate}">
		<input type="hidden" th:field="*{rating}">
		<input type="hidden" th:field="*{comment}" class="btn">
		<input type="submit" value="戻る" class="btn">
	</form>
</body>
</html>
