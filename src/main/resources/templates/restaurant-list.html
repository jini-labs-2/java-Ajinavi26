<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>店舗｜検索、結果</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<style>
  #drop-area {
    border: 2px dashed #aaa;
    padding: 40px;
    width: 400px;
    margin: 50px auto;
    text-align: center;
    border-radius: 10px;
    transition: 0.3s;
  }
  #drop-area.hover {
    border-color: #333;
    background-color: #f0f0f0;
  }
  #file-list {
    margin-top: 20px;
    font-family: monospace;
    color: #333;
  }
</style>
</head>
<body>

<h2>レストラン検索</h2>
<form th:action="@{/restaurant-search}" method="POST" th:object="${restaurantSearchForm}">
	<label>店舗名</label><br>
	<input type="text" th:field="*{restaurantName}"><br>
	<br>
	<input type="submit" value="検索" class="btn">
</form>

<div th:if="${restaurantList} != null">
	<h2>レストラン一覧</h2>
	<table class="restaurant-list">
		<tr>
			<th colspan="2">レビュー</th>
			<th>店舗ID</th>
			<th>店舗名</th>
			<th>キャッチプレーズ</th>
			<th>評価（平均）</th>
		</tr>
		<tr th:each="r : ${restaurantList}">
			<td>
				<form th:action="@{/search-review}" method="POST">
					<input type="hidden" name="restaurantId" th:value="${r.restaurantId}">
					<input type="hidden" name="restaurantName" th:value="${r.restaurantName}">
					<input type="submit" value="一覧" class="tbtn">
				</form>
			</td><td>
				<form th:action="@{/show-review-form}" method="POST">
					<input type="hidden" name="restaurantId" th:value="${r.restaurantId}">
					<input type="hidden" name="restaurantName" th:value="${r.restaurantName}">
					<input type="submit" value="登録" class="tbtn">
				</form>
			</td>
			<td th:text="${r.restaurantId}"></td>
			<td th:text="${r.restaurantName}"></td>
			<td th:text="${r.catchPhrase}"></td>
			<td th:text="${r.formatAverageRating()}"></td>
		</tr>
	</table>
	
</div>
<hr>
drag and drop test
<hr>
<div id="drop-area">
  <p>ここにファイルをドロップするか、ボタンで選択してください</p>
  <input type="file" id="fileInput" hidden>
  <button onclick="fileInput.click()">ファイルを選択</button>
  <div id="file-list"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
