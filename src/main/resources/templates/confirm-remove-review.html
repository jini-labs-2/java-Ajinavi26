<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>レビュー削除｜確認</title>
</head>
<body>
	<h2>レビュー削除確認</h2>
	<table class="confirm-table" th:object="${reviewRemoveForm}">
	<tr>
		<td class="guide">ID</td>
		<td th:text="*{reviewId}"></td>
	</tr>
	<tr>
		<td class="guide">利用者ID</td>
		<td th:text="*{userId}"></td>
	</tr>
	<tr>
		<td class="guide">来日日</td>
		<td th:text="*{visitDate}"></td>
	</tr>
	<tr>
		<td class="guide">評価（１〜５）</td>
		<td th:text="*{rating}"></td>
	</tr>
	<tr>
		<td class="guide">一言コメント</td>
		<td th:text="*{comment}"></td>
	</tr>
	</table>
		
	<form th:action="@{/confirm-remove-review}" method="POST" th:object="${reviewRemoveForm}">
		<input type="hidden" th:field="*{reviewId}">
		<input type="hidden" th:field="*{restaurantId}">
		<input type="hidden" th:field="*{userId}">
		<input type="hidden" th:field="*{visitDate}">
		<input type="hidden" th:field="*{rating}">
		<input type="hidden" th:field="*{comment}" class="btn">
		<input type="submit" value="削除する" class="btn">
	</form>

	<form th:action="@{/search-review}" method="POST" th:object="${reviewRemoveForm}">
		<input type="hidden" th:field="*{reviewId}">
		<input type="hidden" th:field="*{restaurantName}">
		<input type="hidden" th:field="*{userId}">
		<input type="hidden" th:field="*{visitDate}">
		<input type="hidden" th:field="*{rating}">
		<input type="hidden" th:field="*{comment}" class="btn">
		<input type="submit" value="戻る" class="btn">
	</form>
</body>
</html>
